{{- /* Mirrors app-operator's reconcile_secretstore.go: get-or-create a Vault SecretStore and
the ServiceAccount it authenticates as. An object that already exists and isn't owned by this
release is left alone, matching the operator's never-overwrite rule. Namespace-scoped objects
are shared across releases, so they're kept on uninstall. */ -}}
{{- if and (not .Values.paused) .Values.secretStore }}
{{- $store := .Values.secretStore }}
{{- $scope := $store.scope | default "Namespace" }}
{{- $saName := .Release.Namespace }}
{{- if eq $scope "App" }}
{{- $saName = include "app-chart.fullname" . }}
{{- end }}
{{- $vault := $store.vault }}
{{- $annotations := dict }}
{{- if eq $scope "Namespace" }}
{{- $_ := set $annotations "helm.sh/resource-policy" "keep" }}
{{- end }}
{{- $objects := list
  (dict "apiVersion" "v1" "kind" "ServiceAccount" "name" $saName "spec" dict)
  (dict "apiVersion" .Values.secretStoreApiVersion "kind" "SecretStore" "name" $store.name "spec" (dict
    "provider" (dict "vault" (dict
      "server" $vault.server
      "path" ($vault.path | default "secret")
      "version" ($vault.version | default "v2")
      "auth" (dict "kubernetes" (dict
        "mountPath" ($vault.authMountPath | default "kubernetes")
        "role" ($vault.role | default (printf "%s-%s" .Release.Namespace $saName))
        "serviceAccountRef" (dict "name" $saName))))))) }}
{{- range $objects }}
{{- $existing := lookup .apiVersion .kind $.Release.Namespace .name }}
{{- $ownedByRelease := eq (dig "metadata" "annotations" "meta.helm.sh/release-name" "" $existing) $.Release.Name }}
{{- if or (not $existing) $ownedByRelease }}
{{- $metadata := dict "name" .name "namespace" $.Release.Namespace "labels" (include "app-chart.labels" $ | fromYaml) }}
{{- if $annotations }}
{{- $_ := set $metadata "annotations" $annotations }}
{{- end }}
{{- $obj := dict "apiVersion" .apiVersion "kind" .kind "metadata" $metadata }}
{{- if .spec }}
{{- $_ := set $obj "spec" .spec }}
{{- end }}
---
{{ toYaml $obj }}
{{- end }}
{{- end }}
{{- end }}
