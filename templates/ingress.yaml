{{- if and (not .Values.paused) .Values.domains }}
{{- $fullname := include "app-chart.fullname" . }}
{{- $annotations := dict }}
{{- with .Values.ingressAnnotations }}
{{- range $k, $v := . }}
{{- $_ := set $annotations $k $v }}
{{- end }}
{{- end }}
{{- range .Values.domains }}
{{- if and .tls .redirect_tls }}
{{- $_ := set $annotations "nginx.ingress.kubernetes.io/force-ssl-redirect" "true" }}
{{- end }}
{{- range $k, $v := .annotations }}
{{- $_ := set $annotations $k $v }}
{{- end }}
{{- end }}
{{- range .Values.domains }}
{{- if and .tls .certIssuer }}
{{- $_ := set $annotations "cert-manager.io/cluster-issuer" .certIssuer }}
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app-chart.labels" . | nindent 4 }}
  {{- if $annotations }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingressClass }}
  ingressClassName: {{ .Values.ingressClass }}
  {{- end }}
  {{- $tlsDomains := list }}
  {{- range .Values.domains }}
  {{- if .tls }}
  {{- $tlsDomains = append $tlsDomains . }}
  {{- end }}
  {{- end }}
  {{- if $tlsDomains }}
  tls:
    {{- range $tlsDomains }}
    - hosts:
        - {{ .name }}
      secretName: {{ .secretName | default (include "app-chart.tlsSecretName" (dict "fullname" $fullname "domain" .name)) }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.domains }}
    - host: {{ .name }}
      http:
        paths:
          - path: {{ .path | default "/" }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}
                port:
                  name: {{ .portName | default "http" }}
    {{- end }}
{{- end }}
