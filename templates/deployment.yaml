{{- include "app-chart.validate" . -}}
{{- if not .Values.paused }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app-chart.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app-chart.labels" . | nindent 4 }}
spec:
  {{- $replicas := .Values.replicas | default 1 }}
  {{- /* While an HPA is active it owns the replica count: keep the live value on upgrade so
  helm upgrade doesn't scale the Deployment back to .Values.replicas (mirrors the operator's
  reconcileDeployment). lookup is empty on install and under helm template. */}}
  {{- if and .Values.autoscaling .Values.autoscaling.enabled }}
  {{- $existing := lookup "apps/v1" "Deployment" .Release.Namespace (include "app-chart.fullname" .) }}
  {{- if and $existing $existing.spec $existing.spec.replicas }}
  {{- $replicas = $existing.spec.replicas }}
  {{- end }}
  {{- end }}
  replicas: {{ $replicas }}
  strategy:
    {{- if .Values.disk }}
    type: Recreate
    {{- else }}
    type: RollingUpdate
    {{- end }}
  selector:
    matchLabels:
      {{- include "app-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app-chart.selectorLabels" . | nindent 8 }}
      {{- $hash := include "app-chart.configHash" . }}
      {{- $esHash := include "app-chart.externalSecretHash" . }}
      {{- if or $hash $esHash }}
      annotations:
        {{- if $hash }}
        appdefinition.abexamir.me/config-hash: {{ $hash }}
        {{- end }}
        {{- if $esHash }}
        appdefinition.abexamir.me/external-secret-hash: {{ $esHash }}
        {{- end }}
      {{- end }}
    spec:
      {{- $sc := .Values.securityContext }}
      {{- if and .Values.disk .Values.disk.setFsGroup (not (and $sc $sc.fsGroup)) }}
      securityContext:
        {{- if $sc }}
        {{- toYaml $sc | nindent 8 }}
        {{- end }}
        fsGroup: 1000
      {{- else if $sc }}
      securityContext:
        {{- toYaml $sc | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccountName }}
      serviceAccountName: {{ .Values.serviceAccountName }}
      {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- end }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- $volumes := include "app-chart.volumes" . }}
      {{- if $volumes }}
      volumes:
        {{- $volumes | nindent 8 }}
      {{- end }}
      {{- if .Values.initContainers }}
      initContainers:
        {{- range .Values.initContainers }}
        - {{- include "app-chart.initContainer" (dict "root" $ "container" .) | nindent 10 }}
        {{- end }}
      {{- end }}
      containers:
        {{- range $i, $c := .Values.containers }}
        - {{- include "app-chart.container" (dict "root" $ "container" $c "isPrimary" (eq $i 0)) | nindent 10 }}
        {{- end }}
{{- end }}
