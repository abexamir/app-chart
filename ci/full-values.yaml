# Exercises every field, mirroring app-operator's config/samples/appdefinition_v1_web_app.yaml.
initContainers:
  - name: migrate
    image: busybox:1.36
    command: ["/bin/sh", "-c", "echo migrate done"]
    env:
      - name: DB_HOST
        value: postgres.default.svc
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"

containers:
  - name: web
    image: nginxinc/nginx-unprivileged:alpine
    ports:
      - name: http
        containerPort: 8080
        servicePort: 80
        expose: true
      - name: grpc
        containerPort: 9090
        servicePort: 9090
        expose: true
        protocol: TCP
    env:
      - name: LOG_LEVEL
        value: info
    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        cpu: "1"
        memory: "512Mi"
    readinessProbe:
      httpGet:
        path: /
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
      successThreshold: 1
    livenessProbe:
      tcpSocket:
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3

lifecycle:
  preStop:
    exec:
      command: ["/bin/sh", "-c", "sleep 5"]

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

domains:
  - name: app.example.com
    path: /
    tls: true
    redirect_tls: true
    certIssuer: letsencrypt-prod
    secretName: web-app-tls
    portName: http
  - name: api.example.com
    path: /api
    tls: false
    portName: grpc
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
  # No secretName: exercises the auto-generated tlsSecretName() path.
  - name: admin.example.com
    path: /
    tls: true
    portName: http

ingressClass: nginx
ingressAnnotations:
  nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  nginx.ingress.kubernetes.io/proxy-read-timeout: "60"

configMaps:
  - name: app-config
    mountPath: /etc/config
    data:
      config.yaml: |
        port: 8080
        log_level: info

secrets:
  - name: credentials
    asEnvVars: true
    data:
      DB_PASSWORD: "changeme"
      API_KEY: "abc123"
  - name: preexisting
    mountPath: /etc/preexisting
    secretRef: some-existing-secret

externalSecrets:
  - name: db-creds
    store: vault-cluster
    storeKind: ClusterSecretStore
    refreshInterval: "1h"
    asEnvVars: true
    mountPath: /etc/db
    data:
      - secretKey: DB_PASSWORD
        remoteRef:
          key: secret/data/myapp/db
          property: password
      - secretKey: DB_HOST
        remoteRef:
          key: secret/data/myapp/db
          property: host
          version: "3"
  - name: tls-bundle
    store: vault-cluster
    storeKind: ClusterSecretStore
    refreshInterval: "24h"
    mountPath: /etc/tls
    dataFrom:
      - key: secret/data/myapp/tls

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

nodeSelector:
  kubernetes.io/os: linux

tolerations:
  - key: "dedicated"
    operator: "Equal"
    value: "web"
    effect: "NoSchedule"

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: web-app

loggingConfig:
  stdout:
    enabled: true
    format: json
  stderr:
    enabled: true
    format: json
  files:
    - path: /var/log/app/access.log
      format: json
    - path: /var/log/app/error.log
      format: text
      multilinePattern: "^\\d{4}-\\d{2}-\\d{2}"

imagePullSecrets:
  - name: regcred
